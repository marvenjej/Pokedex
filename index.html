<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokedex</title>
    <link rel="icon" type="image/svg+xml" href="./assets/icons/favicon.svg">

    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="./styles/fonts.css">
    <link rel="stylesheet" href="./styles/default.css">
    <link rel="stylesheet" href="./styles/components.css">

    <script src="./scripts/api.js"></script>
    <script src="./scripts/template.js"></script>
    <script src="./script.js"></script>

</head>

<body onload="init()">

    <div class="header-wrapper">
        <header class="content header">
            <a href="./index.html" aria-label="Pokedex home">
                <img src="./assets/icons/logo.svg" alt="Pokedex logo" class="logo">
            </a>
            <h1>Pokedex</h1>
            <form class="search" role="search" onsubmit="return false">
                <input type="search" data-id="search-input" placeholder="Search Pokémon (min. 3 letters)"
                    aria-label="Search Pokémon" minlength="3">
                <button type="button" data-id="search-button" aria-label="Search">Search</button>
            </form>
        </header>
    </div>

    <main class="content" data-id="content">
        <p data-id="not-found" class="not-found" hidden>No Pokémon found.</p>
        <ul class="card-list" id="pokedex"></ul>
        <button type="button" class="load-more" data-id="load-more-button" aria-label="Load more Pokémon" onclick="loadPokemon()">Load more</button>
    </main>

    <dialog data-id="dialog" aria-label="Pokémon details">
        <button type="button" data-id="close-dialog-button" aria-label="Close dialog">×</button>
        <h2 data-id="overlay-pokemon-name"></h2>
        <img data-id="dialog-image" src="" alt="">
        <div class="dialog-nav">
            <button type="button" data-id="prev-button" aria-label="Previous Pokémon">←</button>
            <button type="button" data-id="next-button" aria-label="Next Pokémon">→</button>
        </div>
    </dialog>

</body>

</html>
